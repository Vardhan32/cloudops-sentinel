services:
  sentinel:
    build: .
    container_name: cloudops-sentinel
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - SENTINEL_MONITOR_INTERVAL=30
    volumes:
      - sentinel-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  sentinel-data:
